allowed_domains:
  - uit.edu.vn
  - www.uit.edu.vn
  - fit.uit.edu.vn
  - ce.uit.edu.vn
  - oep.uit.edu.vn
  - daa.uit.edu.vn
  - grad.uit.edu.vn
  - iro.uit.edu.vn
  - link.uit.edu.vn

include_patterns:
  - '^https?://(www\.)?uit\.edu\.vn(/(tin-tuc|thong-bao|news|tuyen-sinh|nghien-cuu-khoa-hoc).*)?$'
  - '^https?://fit\.uit\.edu\.vn(/.*)?$'
  - '^https?://ce\.uit\.edu\.vn(/.*)?$'
  - '^https?://oep\.uit\.edu\.vn(/(thong-bao|bieu-mau).*)?$'
  - '^https?://daa\.uit\.edu\.vn(/(thong-bao|van-ban|vanban|quy-dinh|quy-che|huong-dan|dao-tao|sinh-vien|tin-tuc).*)?$'
  - '^https?://daa\.uit\.edu\.vn/sites/daa/files/uploads/.*$'
  - '^https?://grad\.uit\.edu\.vn(/.*)?$'
  - '^https?://iro\.uit\.edu\.vn(/.*)?$'
  - '^https?://link\.uit\.edu\.vn/.*$'

exclude_patterns:
  - '\.(jpg|jpeg|png|gif|svg|webp|ico)$'

file_extensions:
  - .pdf
  - .doc
  - .docx
  - .xls
  - .xlsx
  - .ppt
  - .pptx
  - .zip
